# render.yaml — Render Blueprint for Campus Events Backend
# Docs: https://render.com/docs/blueprint-spec
#
# This file lets Render auto-configure your Spring Boot service.
# After connecting GitHub, Render reads this file and pre-fills settings.

services:
  - type: web
    name: campus-events-backend
    runtime: java
    region: oregon
    plan: free

    # Where the Spring Boot code lives inside the repo
    rootDir: backend

    # Build: download Maven wrapper, compile, and package into a fat JAR
    buildCommand: chmod +x mvnw && ./mvnw package -DskipTests -Dmaven.repo.local=.m2repo

    # Start: run the fat JAR; PORT is injected automatically by Render
    startCommand: java -jar target/campus-events-backend-1.0.0.jar

    # Health check path (Spring Boot actuator or root)
    healthCheckPath: /api/actuator/health

    # Environment variables — FILL THESE IN on the Render dashboard
    # (do NOT put real secrets here; this file is committed to GitHub)
    envVars:
      - key: JAVA_VERSION
        value: 25
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false          # Render will prompt you to fill this in
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Fill in your Vercel URL after frontend deploy
