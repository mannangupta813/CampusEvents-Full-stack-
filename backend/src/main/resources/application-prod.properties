# ==========================================================
# Campus Events Backend: PRODUCTION Profile (Render + Railway MySQL)
# Activated automatically when SPRING_PROFILES_ACTIVE=prod
# All secrets come from Render Environment Variables — never hardcoded!
# ==========================================================

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# ----------------------------------------------------------
# MySQL Database (Railway / any cloud MySQL)
# Set these in Render → Environment Variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# ----------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Console disabled in production
spring.h2.console.enabled=false

# ----------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ----------------------------------------------------------
# Connection Pool (HikariCP) — tuned for free-tier cloud
# ----------------------------------------------------------
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ----------------------------------------------------------
# JWT Security — set JWT_SECRET in Render Environment Variables
# ----------------------------------------------------------
campusevents.app.jwtSecret=${JWT_SECRET}
campusevents.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------
# CORS — set CORS_ALLOWED_ORIGINS to your Vercel URL
# Example: https://campus-events-xyz.vercel.app
# ----------------------------------------------------------
campusevents.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ----------------------------------------------------------
# Multipart File Upload
# ----------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------------------------
# Spring Actuator (health check for Render)
# ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.server.base-path=/api
