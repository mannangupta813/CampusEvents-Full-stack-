# ==========================================================
# Campus Events Backend: Development Profile (In-Memory H2)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ==========================================================

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:campus_events_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

campusevents.app.jwtSecret=CampusEventsSuperSecretKeyForJWTSigning2026CollegiatePlatformSecurityKeyShouldBeLongEnough256Bits
campusevents.app.jwtExpirationMs=86400000
campusevents.cors.allowed-origins=*
