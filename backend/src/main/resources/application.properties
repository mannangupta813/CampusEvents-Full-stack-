# ==========================================================
# Campus Events Backend: Spring Boot Configuration
# Embedded Database with MySQL Compatibility Mode (Zero-Setup)
# ==========================================================

server.port=${PORT:8080}
server.servlet.context-path=/api

# ----------------------------------------------------------
# Database Connection: Embedded H2 in MySQL Compatibility Mode
# No MySQL installation needed on your laptop! Data is saved locally in ./data/
# ----------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/campus_events;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Built-in Browser Database Console (Access at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ----------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------
# JWT Security Settings (overridable via ENV)
# ----------------------------------------------------------
campusevents.app.jwtSecret=${JWT_SECRET:CampusEventsSuperSecretKeyForJWTSigning2026CollegiatePlatformSecurityKeyShouldBeLongEnough256Bits}
campusevents.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------
# CORS Allowed Origins (overridable via ENV)
# ----------------------------------------------------------
campusevents.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:5173}

# ----------------------------------------------------------
# Multipart File Upload Settings
# ----------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
